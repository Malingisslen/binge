name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches-ignore: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Audit (high+)
        # Blockerar fortfarande på riktiga high-sev-fynd, men ett trasigt/utfasat
        # audit-endpoint (npm:s "quick"-endpoint svarar 400 Bad Request sedan den
        # börjat fasas ut) eller en nätverksblipp är INTE ett sårbarhetsfynd och
        # ska inte fälla grinden. Skilj de två: exit 0 = rent, endpoint-/nätfel =
        # varna och passera, allt annat (faktiska advisories) = fäll.
        run: |
          set +e
          OUT=$(npm audit --audit-level=high 2>&1)
          CODE=$?
          echo "$OUT"
          if [ $CODE -eq 0 ]; then exit 0; fi
          if echo "$OUT" | grep -qiE "audit endpoint returned an error|Bad Request|Invalid package tree|ENOTFOUND|ETIMEDOUT|ECONNRESET|network"; then
            echo "::warning::npm audit-endpoint otillgängligt — hoppar över audit-grinden (inget sårbarhetsfynd)."
            exit 0
          fi
          exit $CODE

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Workflow-map freshness: every path referenced by docs/workflow-map.html
      # must still exist (renames/deletions). Semantic drift is handled by
      # .claude/hooks/map-freshness.mjs. No deps needed.
      - name: Workflow map paths must exist
        run: node scripts/check-workflow-map.mjs

      # Unit-tests the workflow-map linter itself (path-existence + coverage +
      # content-ratchet logic). Runs on Node's built-in runner — no deps needed.
      - name: Workflow map linter self-tests
        run: node --test scripts/check-workflow-map.test.mjs

      # Every NEXT_PUBLIC_* the client reads must be handed to the production
      # build. NEXT_PUBLIC_FCM_VAPID_KEY was not, from May 2026 to 2026-08-10,
      # and push could not register a single device in production the whole
      # time — with a green CI and a green deploy, because these values are
      # inlined at build time and a missing one is just `undefined` at runtime.
      - name: Public env vars must be wired for deploy
        run: node scripts/check-public-env.mjs

      - name: Public env linter self-tests
        run: node --test scripts/check-public-env.test.mjs

      # ONE run of the suite, with coverage attached (BIN-534). This used to be
      # two steps — `npm test` plus a second `npm run test:coverage` — which ran
      # every test twice per CI run for a report-only number.
      #
      # Blocking semantics are unchanged in both directions:
      #   * TEST FAILURES still fail CI — this step has no continue-on-error, and
      #     `vitest run --coverage` exits non-zero on a failing test exactly like
      #     plain `vitest run`.
      #   * COVERAGE is still report-only and never gates the build — there are
      #     deliberately NO `thresholds` in vitest.config.ts (BIN-525), so the
      #     coverage instrumentation cannot fail this step on its own. Adding a
      #     blocking floor is a founder decision, deliberately deferred.
      # Baseline at introduction (2026-07-16, src/** statements): 33.1%
      # (branches 30.7%, functions 26.4%, lines 32.3%).
      - name: Test (with non-blocking coverage report)
        run: npm run test:coverage

      - name: Build (smoke)
        run: npm run build
        env:
          # Dummy values so the build doesn't crash on missing env vars.
          # The CI build is a smoke test — not deployed.
          #
          # BIN-823: med en dummynyckel failar varje TMDB-hämtning, så urvalet
          # blir bara frö-id:n (~116 sidor). INTE fallback-id:n — fröna unioneras
          # in vid läsning och är aldrig tomma, så SEO_FALLBACK_* är onåbart här.
          # Täckningsgolvet fäller ett sådant bygge med flit (en riktig deploy får
          # aldrig ersätta ~31 000 sidor med ~116), så den här körningen måste
          # säga att den vet om det. deploy.yml
          # är den enda vägen till produktion och sätter flaggan ALDRIG.
          # preview.yml sätter den också, men av ett annat skäl — se kommentaren
          # där; dess nyckel är dessutom tom på dependabot-PR:er, som läser ur
          # Dependabots egna secret-lager.
          SELECTION_ALLOW_THIN: '1'
          NEXT_PUBLIC_TMDB_API_KEY: ci-dummy
          NEXT_PUBLIC_FIREBASE_API_KEY: ci-dummy
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ci-dummy.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ci-dummy
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ci-dummy.appspot.com
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "0"
          NEXT_PUBLIC_FIREBASE_APP_ID: "0:0:web:0"

  # Firestore security-rules tests run against the Firestore emulator, which
  # needs a JVM. Kept as a separate job so it can fail independently of the
  # lint/typecheck/build gate above.
  rules-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install deps
        run: npm ci

      - name: Install Firebase CLI
        # firebase-tools provides the `firebase` binary that `npm run test:rules`
        # (firebase emulators:exec) needs. It is intentionally NOT a project
        # dependency (large, CLI-only), so install it globally here — pinned to
        # match the version used locally.
        run: npm i -g firebase-tools@14.27.0

      - name: Cache Firestore emulator
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          # Version segment matches the firebase-tools pin above so a CLI bump
          # rotates the cache instead of reusing a stale emulator JAR.
          key: firebase-emulators-${{ runner.os }}-fbtools14.27.0

      - name: Rules tests (Firestore emulator)
        # Wraps vitest under `firebase emulators:exec --only firestore`.
        run: npm run test:rules
