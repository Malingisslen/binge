name: Build and Deploy

on:
  push:
    branches: [main]
  schedule:
    # Veckovis metadata-refresh (måndag 04:00 UTC): bust:ar TMDB-byggcachen så
    # titel-metadata (overview, providers, status) hålls färsk. Kod-deployer
    # mellan refresharna återanvänder cachen och blir snabba.
    - cron: '0 4 * * 1'
  workflow_dispatch:
    inputs:
      full_refresh:
        description: 'Full TMDB-cache-refresh (lång byggfönster ~175 min) — använd för att värma en kall cache manuellt mellan de veckovisa körningarna'
        type: boolean
        default: false

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Gate the deploy on the Firestore rules-test suite. A direct push to main
    # never triggers ci.yml (it ignores main), so without this the rules tests
    # would never run on the path a rules change actually takes.
    needs: rules-tests
    steps:
      - uses: actions/checkout@v6
        with:
          # Full history so the rules/functions drift-guard below can diff this
          # push (github.event.before..sha) to see which files changed.
          fetch-depth: 0

      # Drift guard: firestore.rules + functions/** are NOT auto-deployed — only
      # hosting is. If a push to main changed them, fail loudly so prod can't
      # silently run the old version. Deploy them manually, then ship hosting via
      # the "Run workflow" button (workflow_dispatch), which skips this guard.
      - name: Guard — rules/functions changed (deploy them manually)
        if: github.event_name == 'push'
        run: |
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            BEFORE=$(git rev-parse HEAD~1)
          fi
          CHANGED=$(git diff --name-only "$BEFORE" "${{ github.sha }}" -- firestore.rules 'functions/**')
          if [ -n "$CHANGED" ]; then
            echo "::error::firestore.rules or functions/** changed — these are NOT auto-deployed by this workflow."
            echo "Changed files:"
            echo "$CHANGED"
            echo "Deploy manually:  firebase deploy --only firestore:rules    # and/or --only functions"
            echo "Then ship hosting via the 'Run workflow' button (workflow_dispatch) — that skips this guard."
            exit 1
          fi
          echo "No firestore.rules / functions changes in this push — proceeding."

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install deps
        run: npm ci

      # Quality gates — same as CI but run here too so a direct push to main
      # can never deploy red code. If this slows releases, we can move to
      # required status checks via branch protection instead.
      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Restore .next build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-cache-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            next-cache-${{ hashFiles('package-lock.json') }}-
            next-cache-

      - name: Restore TMDB build cache
        uses: actions/cache@v4
        with:
          path: .tmdb-cache
          # Rullande nyckel: varje körning sparar en ny cache, restore-keys
          # plockar senaste. Ger "varm cache från förra deployen".
          key: tmdb-cache-${{ github.run_id }}
          restore-keys: |
            tmdb-cache-

      - name: Build
        # Två regimer delar bygget:
        #  - Kod-deploy (push/dispatch): återanvänder .tmdb-cache och re-hämtar
        #    bara en BUDGETERAD, rullande andel stale titlar (default 1500/worker,
        #    se buildFetch.ts) → tidsbundet även när cachen är helt kall. 45-min-
        #    taket ger marginal åt ett kallt bygge (innan veckovisa full-refreshen
        #    hunnit värma cachen) utan att vänta i evighet om TMDB verkligen hänger.
        #  - Full refresh (veckovis schemalagd ELLER manuell workflow_dispatch med
        #    full_refresh=true): stor budget → full metadata-refresh av alla stale
        #    titlar (~1.5–2 h kallt). Får 175-min-tak så den hinner klart och
        #    repopulerar cachen. Den manuella varianten finns för att värma en kall
        #    cache på begäran (t.ex. om en veckas schemalagd körning missats).
        timeout-minutes: ${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.full_refresh)) && 175 || 45 }}
        run: npm run build
        env:
          NEXT_PUBLIC_TMDB_API_KEY: ${{ secrets.NEXT_PUBLIC_TMDB_API_KEY }}
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
          NEXT_PUBLIC_APP_CHECK_SITE_KEY: ${{ secrets.NEXT_PUBLIC_APP_CHECK_SITE_KEY }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
          NEXT_PUBLIC_APP_ENV: production
          NEXT_PUBLIC_GIT_SHA: ${{ github.sha }}
          # Kod-deploy (push/dispatch): tom → buildFetch default-budget
          # (1500/worker) → snabb, rullande refresh av de populäraste/stale.
          # Schedule: hög budget → full refresh av allt som är stale (cachen
          # repopuleras helt). Ersätter den gamla TMDB_CACHE_BUST-wipen.
          TMDB_BUILD_REFRESH_BUDGET: ${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.full_refresh)) && '1000000' || '' }}

      # Deploy hosting via a direct, pinned firebase-tools call instead of the
      # floating FirebaseExtended/action-hosting-deploy@v0. This is a faithful
      # inline replacement of what that action did (write the service-account
      # key to a temp file, point GOOGLE_APPLICATION_CREDENTIALS at it, run
      # `firebase deploy`) — but it lets us tolerate ONE specific error.
      #
      # BIN-331: when the built out/ is byte-identical to the currently-live
      # version (a scheduled metadata-refresh that changed no assets, or a
      # re-run), Firebase Hosting's release API returns HTTP 400 "is the current
      # active version". Content is already live and correct, so that error is a
      # no-op success — but the action treated it as a hard failure, turning
      # every no-op deploy RED and eroding trust in the deploy signal. Here we
      # treat that one message as success and still fail on anything else (bad
      # creds, quota, network). firebase-tools is pinned to match rules-tests.
      - name: Deploy to Firebase Hosting (tolerate idempotent-release 400)
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          SA="$RUNNER_TEMP/firebase-sa.json"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$SA"
          export GOOGLE_APPLICATION_CREDENTIALS="$SA"
          trap 'rm -f "$SA"' EXIT
          # GitHub's bash runs with `set -eo pipefail`, so disable it around the
          # capture or the step dies before we can read the exit code.
          set +e
          OUT=$(npx --yes firebase-tools@14.27.0 deploy --only hosting --project binge-nu --non-interactive 2>&1)
          CODE=$?
          set -e
          echo "$OUT"
          if [ "$CODE" -eq 0 ]; then
            echo "Hosting deploy succeeded."
            exit 0
          fi
          if printf '%s\n' "$OUT" | grep -qiF "is the current active version"; then
            echo "::notice::Hosting already serving this exact build — idempotent no-op release (HTTP 400, BIN-331). Treating as success."
            exit 0
          fi
          echo "::error::Firebase Hosting deploy failed for a non-idempotent reason — see log above."
          exit "$CODE"

  # Firestore security-rules tests run against the Firestore emulator (needs a
  # JVM). Mirrors ci.yml's rules-tests job so the suite executes on push-to-main
  # too — the deploy job above gates on it via `needs`. Kept separate so it can
  # fail independently and run in parallel with the build.
  rules-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install deps
        run: npm ci

      - name: Install Firebase CLI
        # firebase-tools provides the `firebase` binary that `npm run test:rules`
        # (firebase emulators:exec) needs. Pinned to match the version used locally.
        run: npm i -g firebase-tools@14.27.0

      - name: Cache Firestore emulator
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          # Version segment matches the firebase-tools pin above so a CLI bump
          # rotates the cache instead of reusing a stale emulator JAR.
          key: firebase-emulators-${{ runner.os }}-fbtools14.27.0

      - name: Rules tests (Firestore emulator)
        run: npm run test:rules
