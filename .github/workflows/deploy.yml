name: Build and Deploy

on:
  push:
    branches: [main]
    # A push that only touches docs/, tasks/, .claude/ or Markdown starts no run
    # (BIN-1426). The workflow-map files are named back in because their linter runs
    # here; a later pattern wins over an earlier one. A product test that reads one of
    # these files, scripts/check-published-commands.test.mjs among them, runs with the
    # next push that starts a run.
    paths:
      - '**'
      - '!docs/**'
      - 'docs/workflow-map.html'
      - 'docs/workflow-map-universe.json'
      - '!tasks/**'
      - '!.claude/**'
      - '!**/*.md'
  schedule:
    # Veckovis metadata-refresh (måndag 04:00 UTC): bust:ar TMDB-byggcachen så
    # titel-metadata (overview, providers, status) hålls färsk. Kod-deployer
    # mellan refresharna återanvänder cachen och blir snabba.
    - cron: '0 4 * * 1'
  workflow_dispatch:
    inputs:
      full_refresh:
        description: 'Full TMDB-cache-refresh (lång byggfönster ~175 min) — använd för att värma en kall cache manuellt mellan de veckovisa körningarna'
        type: boolean
        default: false
      backend_deployed_by_hand:
        description: 'Jag har deployat regler och funktioner för hand: deploya bara webbplatsen'
        type: boolean
        default: false
      deploy_all_backend:
        description: 'Deploya regler, index och alla funktioner, oavsett vad som ändrats (efter ditt godkännande)'
        type: boolean
        default: false

# Every job reads the repository and nothing more, unless it says otherwise below.
permissions:
  contents: read

# One lane: a run that waits for Malin's approval holds it, so later pushes, the weekly
# run and Run workflow queue behind it until she approves, rejects or cancels. A newer
# queued run replaces an older queued one (not yet seen in a real run), and the comparison
# in `checks` starts at the last successful run, so the replaced run's rules and functions
# changes are not lost.
concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  # Everything a deploy waits for, and which rules, indexes and functions changed: the
  # `backend` job deploys `deploy`, and the hosting job requires `checked`.
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # Where the comparison starts: this workflow's last successful run on main.
      actions: read
    outputs:
      deploy: ${{ steps.backend-changes.outputs.deploy }}
      checked: ${{ steps.backend-changes.outputs.checked }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: the comparison reaches back to the last successful run's commit.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Refuse two Run workflow choices that contradict each other
        if: github.event_name == 'workflow_dispatch' && inputs.backend_deployed_by_hand && inputs.deploy_all_backend
        run: |
          echo "::error::Välj backend_deployed_by_hand eller deploy_all_backend, inte båda."
          exit 1

      # What the `backend` job deploys (BIN-1426): the rules, indexes and functions changes
      # since this workflow's last successful run on main, so a change whose run failed, was
      # rejected or was cancelled is found again. The run summary lists them for the
      # approval. Uses TypeScript from the root install, hence its place after npm ci.
      # Skipped when Run workflow says the backend was deployed by hand: that run ships
      # hosting only.
      - name: Find rules and functions changes
        id: backend-changes
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.backend_deployed_by_hand) }}
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_ALL: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_all_backend }}
        run: |
          if [ "$DEPLOY_ALL" = "true" ]; then
            node scripts/check-deploy-drift.mjs --github-output "$GITHUB_OUTPUT" --github-summary "$GITHUB_STEP_SUMMARY" --all
          else
            node scripts/check-deploy-drift.mjs --github-output "$GITHUB_OUTPUT" --github-summary "$GITHUB_STEP_SUMMARY" --since-last-deploy "$GITHUB_SHA"
          fi

      # Quality gates — run here so a direct push to main can never deploy red code. If this slows releases, we can move to
      # required status checks via branch protection instead.
      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # functions/ is a second npm project with its own lockfile and TypeScript, which the
      # root typecheck above excludes. The same two steps as pr-checks.yml, which says why.
      - name: Install functions deps
        working-directory: functions
        run: npm ci

      - name: Typecheck functions
        working-directory: functions
        run: npm run typecheck

      # Workflow-map freshness.
      - name: Workflow map paths must exist
        run: node scripts/check-workflow-map.mjs

      # Reviewer knowledge-file caps — a WARNING in the weekly sweep, never a gate.
      # Malin's call 2026-08-25 (BIN-997): the cap should become true instead of staying
      # decoration, but an unattended run must not throw away what the reviewers have
      # learned, and `npm test` must not go red on an overrun. Two things keep that honest:
      # the script exits 0 on an overrun, and `continue-on-error` means even its
      # floor-failure cannot red a deploy.
      #
      # `if: schedule` is what makes this "the weekly sweep" rather than every push — this
      # workflow's own `cron: '0 4 * * 1'`. The FLOOR (the glob stopped matching, so the
      # check measured nothing) is asserted in scripts/check-knowledge-caps.test.mjs under
      # `npm run test:process`, the warning step below. `continue-on-error` here discards
      # this step's exit code, floor failure included.
      - name: Reviewer knowledge-file caps (warning only)
        if: github.event_name == 'schedule'
        continue-on-error: true
        run: npm run check:knowledge-caps

      # The `Script self-tests` step that stood here was removed by BIN-850. Its MIN=2
      # floor did not come for free — vitest only fails when its WHOLE include set
      # matches nothing — so it was replaced in the same commit by
      # scripts/scripts-self-tests-present.test.mjs. BIN-838 built the step; the floor
      # it argued for survives, in the suite.

      # Every NEXT_PUBLIC_* read by src/ must be handed to the build below.
      # Here for the same reason the map linter is: this repo pushes direct to
      # main — so on the ONLY path a production change actually takes, this file
      # is the whole gate. The commit that introduced NEXT_PUBLIC_FCM_VAPID_KEY
      # without wiring it went straight to main.
      # Runs before Build on purpose: ~200 ms, and it fails ahead of a build
      # that can take 45 minutes.
      - name: Public env vars must be wired for deploy
        run: node scripts/check-public-env.mjs

      - name: Test
        run: npm test

      # The process tests read the review log, the git history and the process config, so
      # they can go red without any change to the product. Malin's decision 2026-10-05
      # (BIN-1426): they warn. The time cap is there because `continue-on-error` does not
      # cover a hang.
      - name: Process tests (warning only)
        id: process-tests
        continue-on-error: true
        timeout-minutes: 5
        run: npm run test:process

      - name: Warn when the process tests failed
        if: steps.process-tests.outcome == 'failure'
        run: echo "::warning::npm run test:process failed. It does not stop the deploy (BIN-1426); the step above says which test."

      # Audit (high+) — körs på deploy-vägen (push→main), som är enda vägen till
      # produktion; utan detta steg saknade den vägen audit helt (BIN-344).
      # ADVISORY, inte blockerande: Binge är solo push-direct-to-main, så en
      # nyligen avslöjad transitiv CVE som den deployade committen inte ens rör
      # ska inte kunna frysa en akut hotfix. Riktiga high+-fynd surfas som
      # ::warning:: (syns i deploy-loggen, åtgärda via npm audit fix / dependabot);
      # endpoint-/nätfel sväljs på samma sätt.
      #
      # Sedan BIN-1028 (2026-08-27) finns ingen BLOCKERANDE audit-grind någonstans
      # — den bodde i en workflow som aldrig körde på main, och som därför är
      # raderad på Malins beslut. Vill man härda detta steg till blockerande: byt
      # sista `exit 0` mot `exit $CODE` och lägg `if: github.event_name == 'push'`
      # så workflow_dispatch blir nöd-bypass.
      - name: Audit (high+, advisory)
        run: |
          set +e
          OUT=$(npm audit --audit-level=high 2>&1)
          CODE=$?
          echo "$OUT"
          if [ $CODE -eq 0 ]; then exit 0; fi
          if echo "$OUT" | grep -qiE "audit endpoint returned an error|Bad Request|Invalid package tree|ENOTFOUND|ETIMEDOUT|ECONNRESET|network"; then
            echo "::warning::npm audit-endpoint otillgängligt — hoppar över audit (inget sårbarhetsfynd)."
            exit 0
          fi
          echo "::warning::npm audit hittade high+ sårbarheter — surfat men blockerar INTE prod-deployen (advisory, BIN-344). Åtgärda via npm audit fix / dependabot."
          exit 0

  # Rules, indexes and functions (BIN-1426). Runs only when `checks` found something to
  # deploy, and only after Malin approves the run: the `backend` environment requires her
  # review, and its deploy key is that environment's secret, so no step can read it before
  # her click.
  backend:
    needs: [checks, rules-tests]
    if: needs.checks.outputs.deploy != ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: backend
    permissions:
      contents: read
      # The approval gate reads this run's approvals.
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          # The approval gate compares this commit with main.
          fetch-depth: 0
          persist-credentials: false

      # No npm cache in this job, so nothing restored from a cache runs where the key does.
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # The approval gate uses TypeScript from the root install. No install scripts: this
      # job reads the key later.
      - name: Install deps (no install scripts)
        run: npm ci --ignore-scripts

      # Refuses unless this run holds an approval for `backend`, so an environment that lost
      # its required reviewer still cannot deploy (not yet seen in a real run). Also refuses
      # a run that is not on main, and a re-run of an older commit whose rules or functions
      # main has changed since; where main points comes from GitHub, not from this clone.
      - name: Approval gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check-deploy-drift.mjs --approval-gate

      # The functions predeploy in firebase.json builds functions/ with its own TypeScript.
      - name: Install functions deps (no install scripts)
        working-directory: functions
        run: npm ci --ignore-scripts

      # The same pinned firebase-tools and key-file pattern as the hosting deploy below. As
      # there, npx installs firebase-tools' own dependencies in this step, with the key in its
      # environment, without a lockfile (it ships no npm-shrinkwrap.json) and without
      # --ignore-scripts.
      # No --force: a function deletion stops the deploy and is done by hand.
      - name: Deploy rules and functions
        id: backend-deploy
        env:
          FIREBASE_BACKEND_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_BACKEND_SERVICE_ACCOUNT }}
          DEPLOY_ARGS: ${{ needs.checks.outputs.deploy }}
        run: |
          set -o pipefail
          if [ -z "$FIREBASE_BACKEND_SERVICE_ACCOUNT" ]; then
            echo "::error::Nyckeln FIREBASE_BACKEND_SERVICE_ACCOUNT saknas i miljön backend. Deploya för hand med firebase deploy $DEPLOY_ARGS --project binge-nu och kör sedan Run workflow med backend_deployed_by_hand."
            exit 1
          fi
          read -ra ARGS <<< "$DEPLOY_ARGS"
          SA="$RUNNER_TEMP/firebase-backend-sa.json"
          trap 'rm -f "$SA"' EXIT
          printf '%s' "$FIREBASE_BACKEND_SERVICE_ACCOUNT" > "$SA"
          export GOOGLE_APPLICATION_CREDENTIALS="$SA"
          npx --yes firebase-tools@15.22.3 deploy "${ARGS[@]}" --project binge-nu --non-interactive 2>&1 | tee "$RUNNER_TEMP/backend-deploy.log"
          # Without --force, firebase skips a function whose trigger changes event type and
          # still exits 0 (firebase-tools 15.22.3, lib/deploy/functions/prompts.js).
          if grep -qF "Skipping updates for functions that may be unsafe to update" "$RUNNER_TEMP/backend-deploy.log"; then
            echo "::warning::firebase hoppade över funktioner vars utlösare byter händelsetyp. Deploya dem för hand med firebase deploy --only functions --project binge-nu."
            echo "> **Varning:** firebase hoppade över funktioner vars utlösare byter händelsetyp. Deploya dem för hand med \`firebase deploy --only functions --project binge-nu\`, som frågar innan den flyttar dem." >> "$GITHUB_STEP_SUMMARY"
          fi

      # Malin reads the run summary, not the log.
      - name: Say what to do after a failed deploy
        if: failure() && steps.backend-deploy.outcome == 'failure'
        env:
          DEPLOY_ARGS: ${{ needs.checks.outputs.deploy }}
        run: |
          LOG="$RUNNER_TEMP/backend-deploy.log"
          {
            echo "### Regler och funktioner deployades inte"
            echo
            if [ -f "$LOG" ]; then
              echo "Sista raderna från firebase:"
              echo
              echo '```'
              tail -n 30 "$LOG" | tr '`' "'"
              echo '```'
              echo
            fi
            # firebase-tools 15.22.3 throws this after deploying the functions when the image
            # repository has no cleanup policy (lib/deploy/functions/prompts.js).
            if [ -f "$LOG" ] && grep -qF "could not set up cleanup policy" "$LOG"; then
              echo "- **Funktionerna är ute, men städregeln för funktionsbilder saknas.** Kör \`firebase functions:artifacts:setpolicy --location europe-west1 --project binge-nu\` en gång och tryck sedan **Re-run failed jobs**."
            fi
            echo "- Ett tillfälligt fel: tryck **Re-run failed jobs** och godkänn igen."
            echo "- Annars: deploya för hand med \`firebase deploy $DEPLOY_ARGS --project binge-nu\` och kör sedan **Run workflow** med backend_deployed_by_hand, så går webbplatsen ut."
            echo "- Alltid för hand: att ta bort en funktion, en ny hemlighet, en trigger som behöver en ny tjänst, städregeln för funktionsbilder, och när firebase frågar om retry eller minInstances."
            echo "- Om felet gäller funktionerna kan nya regler och index redan vara ute."
          } >> "$GITHUB_STEP_SUMMARY"

  # Hosting: the site itself. Waits for the checks, the rules tests, and the backend job
  # when it runs, so rules and functions go out before the site. Requires `checked` unless
  # Run workflow says the backend was deployed by hand, so a comparison that never ran
  # cannot wave the site through. The job cap is for a hang outside the steps that carry
  # their own; it sits above the build step's longest cap.
  deploy:
    needs: [checks, rules-tests, backend]
    if: ${{ !cancelled() && needs.checks.result == 'success' && needs.rules-tests.result == 'success' && (needs.backend.result == 'success' || needs.backend.result == 'skipped') && (needs.checks.outputs.checked == 'true' || (github.event_name == 'workflow_dispatch' && inputs.backend_deployed_by_hand)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 220
    permissions:
      contents: read
      # The site gate reads this workflow's successful runs.
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: the site gate asks whether a deployed commit comes after this one.
          fetch-depth: 0
          # Nothing in this job pushes, so the token stays out of .git/config.
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install deps
        run: npm ci

      # A re-run of an older run would put its site back over a newer one, for instance
      # after Re-run failed jobs (BIN-1426). Before the build, so a refusal costs no build.
      - name: Site gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check-deploy-drift.mjs --site-gate

      - name: Restore .next build cache
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: next-cache-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            next-cache-${{ hashFiles('package-lock.json') }}-
            next-cache-

      # Restore och save är MEDVETET delade (BIN-815). Med den sammanslagna
      # `actions/cache@v4` körs sparandet som ett post-steg som hoppas över när
      # bygget fälls — `Post Restore TMDB build cache = skipped` syns på varje
      # hängd körning 2026-08-07. Följden är att ett omförsök startar från exakt
      # samma cachetillstånd som just misslyckades: ett nytt tärningskast, inte
      # ett varmare bygge.
      #
      # `timeout-minutes` nedan sitter på BYGGSTEGET. Ett steg som slår i taket
      # fäller steget och jobbet fortsätter till `always()`-stegen som vanligt —
      # det är alltså inte fallet "jobbet avbryts och hinner inte spara". Bevis i
      # samma riktning: raden `Post Restore TMDB build cache = skipped` visar att
      # köraren fortsatte bearbeta steg. Sparandet bör alltså fyra även på en
      # hängning. Bekräfta ändå på nästa riktiga hängning innan någon förlitar
      # sig på det.
      - name: Restore TMDB build cache
        id: tmdb-cache
        uses: actions/cache/restore@v6
        with:
          path: .tmdb-cache
          # Rullande nyckel: varje körning sparar en ny cache, restore-keys
          # plockar senaste. Ger "varm cache från förra deployen".
          # run_attempt ingår (BIN-815): `github.run_id` är OFÖRÄNDRAT när en
          # körning görs om via "Re-run jobs", så utan det kolliderar försök 2:s
          # sparande med försök 1:s nyckel och kastas tyst — alltså precis på
          # omförsöks-vägen det här steget finns för. Prefixet `tmdb-cache-`
          # plockar ändå senaste posten.
          key: tmdb-cache-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            tmdb-cache-

      - name: Build
        id: build
        # Två regimer delar bygget:
        #  - Kod-deploy (push/dispatch): återanvänder .tmdb-cache och re-hämtar
        #    bara en BUDGETERAD, rullande andel stale titlar (default 1500/worker,
        #    se buildFetch.ts) → tidsbundet även när cachen är helt kall. 45-min-
        #    taket ger marginal åt ett kallt bygge (innan veckovisa full-refreshen
        #    hunnit värma cachen) utan att vänta i evighet om TMDB verkligen hänger.
        #  - Full refresh (veckovis schemalagd ELLER manuell workflow_dispatch med
        #    full_refresh=true): stor budget → full metadata-refresh av alla stale
        #    titlar (~1.5–2 h kallt). Får 175-min-tak så den hinner klart och
        #    repopulerar cachen. Den manuella varianten finns för att värma en kall
        #    cache på begäran (t.ex. om en veckas schemalagd körning missats).
        timeout-minutes: ${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.full_refresh)) && 175 || 45 }}
        run: npm run build
        env:
          NEXT_PUBLIC_TMDB_API_KEY: ${{ secrets.NEXT_PUBLIC_TMDB_API_KEY }}
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
          NEXT_PUBLIC_APP_CHECK_SITE_KEY: ${{ secrets.NEXT_PUBLIC_APP_CHECK_SITE_KEY }}
          # Utan den här kan enablePushForUser inte ens börja: den kastar på
          # rad 1 och skriver aldrig en fcmTokens-doc, så sendPushToUser hittar
          # inga tokens och varenda push tystnar. Den saknades i den här listan
          # från maj till 2026-08-10 — push var dött i prod hela tiden, och
          # ingenting sa det: kryssrutan gick bara inte att kryssa i, och
          # NEXT_PUBLIC_*-variabler inlineas vid byggtid så en saknad nyckel
          # syns aldrig i något bygge. Guarden mot en ny lucka är steget
          # "Public env vars must be wired for deploy" ovan — i DEN HÄR filen.
          NEXT_PUBLIC_FCM_VAPID_KEY: ${{ secrets.NEXT_PUBLIC_FCM_VAPID_KEY }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
          NEXT_PUBLIC_APP_ENV: production
          NEXT_PUBLIC_GIT_SHA: ${{ github.sha }}
          # Kod-deploy (push/dispatch): tom → buildFetch default-budget
          # (1500/worker) → snabb, rullande refresh av de populäraste/stale.
          # Schedule: hög budget → full refresh av allt som är stale (cachen
          # repopuleras helt). Ersätter den gamla TMDB_CACHE_BUST-wipen.
          TMDB_BUILD_REFRESH_BUDGET: ${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.full_refresh)) && '1000000' || '' }}
          # BIN-823: styr URVALET av id:n, inte hur många detaljsvar som får
          # re-hämtas. Samma villkor som budgeten ovan bara för att båda hör till
          # veckobygget — de är olika saker och har därför egna flaggor.
          #
          # Tom (kod-deploy) → routerna läser urvalet ur .tmdb-cache/selection-*.json
          # och gör NOLL listanrop. '1' (schedule/full_refresh) → urvalet härleds
          # om ur TMDB:s topplistor och UNIONERAS med det befintliga; en titel som
          # roterat ur topplistan behålls tills taket tvingar fram evakuering.
          #
          # Före detta härleddes urvalet vid varje deploy, och eftersom TMDB:s
          # ranking roterar veckovis roterade urvalet med den: titlar ramlade ur,
          # föll till catch-all-routens noindex och avindexerades av Google
          # (264 → 117 indexerade sidor på fem veckor).
          TMDB_SELECTION_REFRESH: ${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.full_refresh)) && '1' || '' }}

      # BIN-613. Sidornas laddningsstorlek mäts här och jämförs med föregående BYGGE.
      # Steget ligger före utrullningen, så ett bygge som aldrig nådde produktion har
      # ändå skrivit sin baslinje.
      # Malins beslut 2026-09-03: den RAPPORTERAR, den blockerar aldrig. Kriteriet "ingen
      # First Load JS-regression mot baslinjen" fanns i hygienreglerna utan att någon
      # baslinje existerade, alltså utan att kunna betygsättas.
      #
      # STEGET LIGGER FÖRE cache-sparandet med flit: baslinjen skrivs till .tmdb-cache/,
      # och det är nästa steg som packar den katalogen. Efteråt skulle mätningen köra,
      # rapportera, och tappa sitt minne varje gång — en tabell där varje rad står som
      # "ny" för alltid.
      #
      # Inget `if:`. Standardsemantiken hoppar över steget när bygget fällde, vilket är
      # rätt.
      #
      # Inget `env:`. Deploy-hemligheterna är stegbundna i den här filen, och den
      # isoleringen är vad som håller ett fel i ett orelaterat steg borta från
      # produktionsuppgifterna. Skriptet behöver ingen av dem.
      #
      # `continue-on-error` OCH skriptets egen try/catch, båda: catchen stänger ett kast,
      # flaggan är skyddet för det catchen inte ser — slut på minne, en Node-abort, eller
      # taket nedan. `timeout-minutes` behövs separat: "fäller aldrig" täcker inte en
      # HÄNGNING.
      - name: First Load JS-rapport (rapporterar, fäller aldrig)
        continue-on-error: true
        timeout-minutes: 2
        run: node scripts/bundle-report.mjs
      # Spara TMDB-cachen ÄVEN när bygget fällde (BIN-815) — se kommentaren vid
      # restore-steget för vad detta bevisligen täcker och vad som är obekräftat.
      # `continue-on-error` för att ett misslyckat cache-sparande aldrig får bli
      # anledningen att en grön deploy inte når binge.nu.
      - name: Save TMDB build cache
        # Villkoret är "restore-steget hann köra", vilket är den verkliga
        # förutsättningen: utan det finns ingen nyckel att spara under. Ett steg
        # som aldrig nåddes har TOM conclusion, inte 'skipped', så en kontroll mot
        # 'skipped' hade varit en tom bock som aldrig fyrar.
        if: always() && steps.tmdb-cache.outputs.cache-primary-key != ''
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: .tmdb-cache
          key: ${{ steps.tmdb-cache.outputs.cache-primary-key }}

      # Guard the `**/__next._full.txt` entry in firebase.json's hosting.ignore.
      #
      # Next 16's static export writes a `__next._full.txt` into every page
      # directory that is a BYTE-IDENTICAL twin of the sibling `index.txt`
      # (~22 900 files, ~1.5 GB per deploy). Nothing ever requests it — the
      # client router builds its RSC URL as `pathname += "index.txt"`, and
      # `_full` appears nowhere in the bundle, the HTML, the `__next._tree.txt`
      # payloads, the sitemap or the service worker. So we stop uploading it.
      #
      # That premise is a Next.js INTERNAL, and this repo takes Next minors via
      # the weekly dependabot `react-next` group. Two failure modes, two
      # responses — deliberately split:
      #
      #   * The files are GONE (Next renamed or dropped them). The ignore glob
      #     is now a no-op: we quietly stop saving, the site is fine. ADVISORY —
      #     ::warning:: and continue, same reasoning as the audit step above
      #     (BIN-344): this is the only prod path and a cost regression must not
      #     freeze an urgent hotfix.
      #   * The files EXIST but are no longer identical twins of index.txt. Now
      #     the glob may be dropping real content, and Firebase Hosting caches
      #     .txt for a day (see the headers block in firebase.json), so a bad
      #     deploy costs a rebuild plus a Cloudflare purge. BLOCKING.
      #
      # Guarding the invariant rather than the filename is the point: a name
      # check cannot catch "Next kept the name and changed the meaning".
      - name: Verify the ignored RSC twin is still a duplicate
        run: |
          set -euo pipefail
          FULL=$(find out -type f -name '__next._full.txt' | wc -l)
          INDEX=$(find out -type f -name 'index.txt' | wc -l)
          echo "__next._full.txt: $FULL   index.txt: $INDEX"

          if [ "$FULL" -eq 0 ]; then
            echo "::warning::No __next._full.txt in the build — the hosting.ignore entry is a no-op and the ~1.5 GB/deploy saving is gone. Next.js probably renamed the static-export segment artifacts. Re-check which files are unreferenced and update firebase.json + .claude/rules/deployment.md."
            exit 0
          fi

          if [ "$FULL" -ne "$INDEX" ]; then
            echo "::error::__next._full.txt ($FULL) and index.txt ($INDEX) no longer pair up 1:1 — the ignore glob may be dropping content that has no twin. Refusing to deploy."
            exit 1
          fi

          # Byte-identity on a sample. Full comparison would be 22 900 cmp calls.
          # 50 of ~22 900 only catches a SYSTEMIC change — which is the only
          # realistic one, since a Next upgrade changes every page the same way.
          # It would miss a single anomalous file; that is accepted.
          BAD=0
          for f in $(find out -type f -name '__next._full.txt' | shuf -n 50); do
            if ! cmp -s "$f" "$(dirname "$f")/index.txt"; then
              echo "::error::$f differs from its sibling index.txt"
              BAD=$((BAD + 1))
            fi
          done
          if [ "$BAD" -ne 0 ]; then
            echo "::error::$BAD of 50 sampled __next._full.txt files are NOT duplicates of index.txt. The premise behind the hosting.ignore entry no longer holds. Refusing to deploy."
            exit 1
          fi
          echo "50/50 sampled files are byte-identical twins — safe to ignore on upload."

      # Deploy hosting via a direct, pinned firebase-tools call instead of the
      # floating FirebaseExtended/action-hosting-deploy@v0. This is a faithful
      # inline replacement of what that action did (write the service-account
      # key to a temp file, point GOOGLE_APPLICATION_CREDENTIALS at it, run
      # `firebase deploy`) — but it lets us tolerate ONE specific error.
      #
      # BIN-331: when the built out/ is byte-identical to the currently-live
      # version (a scheduled metadata-refresh that changed no assets, or a
      # re-run), Firebase Hosting's release API returns HTTP 400 "is the current
      # active version". Content is already live and correct, so that error is a
      # no-op success — but the action treated it as a hard failure, turning
      # every no-op deploy RED and eroding trust in the deploy signal. Here we
      # treat that one message as success and still fail on anything else (bad
      # creds, quota, network).
      #
      # firebase-tools is pinned to 15.22.3 — the version the old action
      # resolved to and which we observed authenticating via the service-account
      # ADC path (GOOGLE_APPLICATION_CREDENTIALS). NOTE: this intentionally
      # DIFFERS from the rules-tests job's 14.27.0 pin — 14.x fails hosting auth
      # with "have you run firebase login?" because service-account ADC for
      # `deploy` only works reliably in the 15.x series; rules-tests keeps 14.27.0
      # for emulator-JAR compatibility. Two pins, two concerns.
      - name: Deploy to Firebase Hosting (tolerate idempotent-release 400)
        timeout-minutes: 30
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          SA="$RUNNER_TEMP/firebase-sa.json"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$SA"
          export GOOGLE_APPLICATION_CREDENTIALS="$SA"
          trap 'rm -f "$SA"' EXIT
          # GitHub's bash runs with `set -eo pipefail`, so disable it around the
          # capture or the step dies before we can read the exit code.
          set +e
          OUT=$(npx --yes firebase-tools@15.22.3 deploy --only hosting --project binge-nu --non-interactive 2>&1)
          CODE=$?
          set -e
          echo "$OUT"
          if [ "$CODE" -eq 0 ]; then
            echo "Hosting deploy succeeded."
            exit 0
          fi
          if printf '%s\n' "$OUT" | grep -qiF "is the current active version"; then
            echo "::notice::Hosting already serving this exact build — idempotent no-op release (HTTP 400, BIN-331). Treating as success."
            exit 0
          fi
          echo "::error::Firebase Hosting deploy failed for a non-idempotent reason — see log above."
          exit "$CODE"

  # Firestore security-rules tests run against the Firestore emulator (needs a
  # JVM). Its own job so the suite executes on push-to-main — the backend and
  # hosting jobs above gate on it via `needs`. Kept separate so it can fail
  # independently.
  rules-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Install deps
        run: npm ci

      - name: Install Firebase CLI
        # firebase-tools provides the `firebase` binary that `npm run test:rules`
        # (firebase emulators:exec) needs. Pinned to match the version used locally.
        run: npm i -g firebase-tools@14.27.0

      - name: Cache Firestore emulator
        uses: actions/cache@v6
        with:
          path: ~/.cache/firebase/emulators
          # Version segment matches the firebase-tools pin above so a CLI bump
          # rotates the cache instead of reusing a stale emulator JAR.
          key: firebase-emulators-${{ runner.os }}-fbtools14.27.0

      - name: Rules tests (Firestore emulator)
        run: npm run test:rules
