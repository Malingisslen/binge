name: Build and Deploy

on:
  push:
    branches: [main]
  schedule:
    # Veckovis metadata-refresh (måndag 04:00 UTC): bust:ar TMDB-byggcachen så
    # titel-metadata (overview, providers, status) hålls färsk. Kod-deployer
    # mellan refresharna återanvänder cachen och blir snabba.
    - cron: '0 4 * * 1'
  workflow_dispatch:
    inputs:
      full_refresh:
        description: 'Full TMDB-cache-refresh (lång byggfönster ~175 min) — använd för att värma en kall cache manuellt mellan de veckovisa körningarna'
        type: boolean
        default: false

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Gate the deploy on the Firestore rules-test suite. A direct push to main
    # never triggers ci.yml (it ignores main), so without this the rules tests
    # would never run on the path a rules change actually takes.
    needs: rules-tests
    steps:
      - uses: actions/checkout@v6
        with:
          # Full history so the rules/functions drift-guard below can diff this
          # push (github.event.before..sha) to see which files changed.
          fetch-depth: 0

      # Drift guard: firestore.rules + functions/** are NOT auto-deployed — only
      # hosting is. If a push to main changed them, fail loudly so prod can't
      # silently run the old version. Deploy them manually, then ship hosting via
      # the "Run workflow" button (workflow_dispatch), which skips this guard.
      - name: Guard — rules/functions changed (deploy them manually)
        if: github.event_name == 'push'
        run: |
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            BEFORE=$(git rev-parse HEAD~1)
          fi
          CHANGED=$(git diff --name-only "$BEFORE" "${{ github.sha }}" -- firestore.rules 'functions/**')
          if [ -n "$CHANGED" ]; then
            echo "::error::firestore.rules or functions/** changed — these are NOT auto-deployed by this workflow."
            echo "Changed files:"
            echo "$CHANGED"
            echo "Deploy manually:  firebase deploy --only firestore:rules    # and/or --only functions"
            echo "Then ship hosting via the 'Run workflow' button (workflow_dispatch) — that skips this guard."
            exit 1
          fi
          echo "No firestore.rules / functions changes in this push — proceeding."

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install deps
        run: npm ci

      # Quality gates — same as CI but run here too so a direct push to main
      # can never deploy red code. If this slows releases, we can move to
      # required status checks via branch protection instead.
      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Workflow-map freshness (same check as ci.yml — deploy is the only
      # gate on direct pushes to main).
      - name: Workflow map paths must exist
        run: node scripts/check-workflow-map.mjs

      # The `Script self-tests` step that stood here was removed by BIN-850: these files
      # now run under `npm test` (vitest.config.ts includes scripts/**/*.{test,spec}.mjs),
      # so keeping the step would run them twice, two ways. Its MIN=2 floor did not come
      # for free — vitest only fails when its WHOLE include set matches nothing — so it
      # was replaced in the same commit by scripts/scripts-self-tests-present.test.mjs.
      # BIN-838 built the step; the floor it argued for survives, in the suite.

      # Every NEXT_PUBLIC_* read by src/ must be handed to the build below.
      # Duplicated from ci.yml for the same reason the map linter is: ci.yml
      # ignores main, and this repo pushes direct to main — so on the ONLY path
      # a production change actually takes, this file is the whole gate. The
      # commit that introduced NEXT_PUBLIC_FCM_VAPID_KEY without wiring it went
      # straight to main and would never have reached a ci.yml run.
      # Runs before Build on purpose: ~200 ms, and it fails ahead of a build
      # that can take 45 minutes.
      - name: Public env vars must be wired for deploy
        run: node scripts/check-public-env.mjs

      - name: Test
        run: npm test

      # Audit (high+) — körs på deploy-vägen (push→main) eftersom ci.yml hoppar
      # över main, så den enda prod-vägen saknade annars audit helt (BIN-344).
      # ADVISORY, inte blockerande: Binge är solo push-direct-to-main, så detta
      # är den enda prod-deploy-vägen — en nyligen avslöjad transitiv CVE som
      # den deployade committen inte ens rör ska inte kunna frysa en akut hotfix.
      # Riktiga high+-fynd surfas som ::warning:: (syns i deploy-loggen, åtgärda
      # via npm audit fix / dependabot); endpoint-/nätfel sväljs precis som i
      # ci.yml. Den BLOCKERANDE grinden bor i ci.yml (PR/non-main-vägen). Vill man
      # härda detta till blockerande: byt sista `exit 0` mot `exit $CODE` och lägg
      # `if: github.event_name == 'push'` så workflow_dispatch blir nöd-bypass.
      - name: Audit (high+, advisory)
        run: |
          set +e
          OUT=$(npm audit --audit-level=high 2>&1)
          CODE=$?
          echo "$OUT"
          if [ $CODE -eq 0 ]; then exit 0; fi
          if echo "$OUT" | grep -qiE "audit endpoint returned an error|Bad Request|Invalid package tree|ENOTFOUND|ETIMEDOUT|ECONNRESET|network"; then
            echo "::warning::npm audit-endpoint otillgängligt — hoppar över audit (inget sårbarhetsfynd)."
            exit 0
          fi
          echo "::warning::npm audit hittade high+ sårbarheter — surfat men blockerar INTE prod-deployen (advisory, BIN-344). Åtgärda via npm audit fix / dependabot."
          exit 0

      - name: Restore .next build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-cache-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            next-cache-${{ hashFiles('package-lock.json') }}-
            next-cache-

      # Restore och save är MEDVETET delade (BIN-815). Med den sammanslagna
      # `actions/cache@v4` körs sparandet som ett post-steg som hoppas över när
      # bygget fälls — `Post Restore TMDB build cache = skipped` syns på varje
      # hängd körning 2026-08-07. Följden är att ett omförsök startar från exakt
      # samma cachetillstånd som just misslyckades: ett nytt tärningskast, inte
      # ett varmare bygge.
      #
      # `timeout-minutes` nedan sitter på BYGGSTEGET, inte på jobbet, och det
      # finns inget jobbnivå-tak. Ett steg som slår i taket fäller steget och
      # jobbet fortsätter till `always()`-stegen som vanligt — det är alltså inte
      # fallet "jobbet avbryts och hinner inte spara". Bevis i samma riktning:
      # raden `Post Restore TMDB build cache = skipped` visar att köraren
      # fortsatte bearbeta steg. Sparandet bör alltså fyra även på en hängning.
      # Bekräfta ändå på nästa riktiga hängning innan någon förlitar sig på det.
      - name: Restore TMDB build cache
        id: tmdb-cache
        uses: actions/cache/restore@v4
        with:
          path: .tmdb-cache
          # Rullande nyckel: varje körning sparar en ny cache, restore-keys
          # plockar senaste. Ger "varm cache från förra deployen".
          # run_attempt ingår (BIN-815): `github.run_id` är OFÖRÄNDRAT när en
          # körning görs om via "Re-run jobs", så utan det kolliderar försök 2:s
          # sparande med försök 1:s nyckel och kastas tyst — alltså precis på
          # omförsöks-vägen det här steget finns för. Prefixet `tmdb-cache-`
          # plockar ändå senaste posten.
          key: tmdb-cache-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            tmdb-cache-

      - name: Build
        id: build
        # Två regimer delar bygget:
        #  - Kod-deploy (push/dispatch): återanvänder .tmdb-cache och re-hämtar
        #    bara en BUDGETERAD, rullande andel stale titlar (default 1500/worker,
        #    se buildFetch.ts) → tidsbundet även när cachen är helt kall. 45-min-
        #    taket ger marginal åt ett kallt bygge (innan veckovisa full-refreshen
        #    hunnit värma cachen) utan att vänta i evighet om TMDB verkligen hänger.
        #  - Full refresh (veckovis schemalagd ELLER manuell workflow_dispatch med
        #    full_refresh=true): stor budget → full metadata-refresh av alla stale
        #    titlar (~1.5–2 h kallt). Får 175-min-tak så den hinner klart och
        #    repopulerar cachen. Den manuella varianten finns för att värma en kall
        #    cache på begäran (t.ex. om en veckas schemalagd körning missats).
        timeout-minutes: ${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.full_refresh)) && 175 || 45 }}
        run: npm run build
        env:
          NEXT_PUBLIC_TMDB_API_KEY: ${{ secrets.NEXT_PUBLIC_TMDB_API_KEY }}
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
          NEXT_PUBLIC_APP_CHECK_SITE_KEY: ${{ secrets.NEXT_PUBLIC_APP_CHECK_SITE_KEY }}
          # Utan den här kan enablePushForUser inte ens börja: den kastar på
          # rad 1 och skriver aldrig en fcmTokens-doc, så sendPushToUser hittar
          # inga tokens och varenda push tystnar. Den saknades i den här listan
          # från maj till 2026-08-10 — push var dött i prod hela tiden, och
          # ingenting sa det: kryssrutan gick bara inte att kryssa i, och
          # NEXT_PUBLIC_*-variabler inlineas vid byggtid så en saknad nyckel
          # syns aldrig i något bygge. Guarden mot en ny lucka är steget
          # "Public env vars must be wired for deploy" ovan — i DEN HÄR filen,
          # för ci.yml ignorerar main och skulle aldrig ha kört på commiten
          # som orsakade det här.
          NEXT_PUBLIC_FCM_VAPID_KEY: ${{ secrets.NEXT_PUBLIC_FCM_VAPID_KEY }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
          NEXT_PUBLIC_APP_ENV: production
          NEXT_PUBLIC_GIT_SHA: ${{ github.sha }}
          # Kod-deploy (push/dispatch): tom → buildFetch default-budget
          # (1500/worker) → snabb, rullande refresh av de populäraste/stale.
          # Schedule: hög budget → full refresh av allt som är stale (cachen
          # repopuleras helt). Ersätter den gamla TMDB_CACHE_BUST-wipen.
          TMDB_BUILD_REFRESH_BUDGET: ${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.full_refresh)) && '1000000' || '' }}
          # BIN-823: styr URVALET av id:n, inte hur många detaljsvar som får
          # re-hämtas. Samma villkor som budgeten ovan bara för att båda hör till
          # veckobygget — de är olika saker och har därför egna flaggor.
          #
          # Tom (kod-deploy) → routerna läser urvalet ur .tmdb-cache/selection-*.json
          # och gör NOLL listanrop. '1' (schedule/full_refresh) → urvalet härleds
          # om ur TMDB:s topplistor och UNIONERAS med det befintliga; en titel som
          # roterat ur topplistan behålls tills taket tvingar fram evakuering.
          #
          # Före detta härleddes urvalet vid varje deploy, och eftersom TMDB:s
          # ranking roterar veckovis roterade urvalet med den: titlar ramlade ur,
          # föll till catch-all-routens noindex och avindexerades av Google
          # (264 → 117 indexerade sidor på fem veckor).
          TMDB_SELECTION_REFRESH: ${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.full_refresh)) && '1' || '' }}

      # Spara TMDB-cachen ÄVEN när bygget fällde (BIN-815) — se kommentaren vid
      # restore-steget för vad detta bevisligen täcker och vad som är obekräftat.
      # `continue-on-error` för att ett misslyckat cache-sparande aldrig får bli
      # anledningen att en grön deploy inte når binge.nu.
      - name: Save TMDB build cache
        # Villkoret är "restore-steget hann köra", vilket är den verkliga
        # förutsättningen: utan det finns ingen nyckel att spara under. Ett steg
        # som aldrig nåddes har TOM conclusion, inte 'skipped', så en kontroll mot
        # 'skipped' hade varit en tom bock som aldrig fyrar.
        if: always() && steps.tmdb-cache.outputs.cache-primary-key != ''
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .tmdb-cache
          key: ${{ steps.tmdb-cache.outputs.cache-primary-key }}

      # Guard the `**/__next._full.txt` entry in firebase.json's hosting.ignore.
      #
      # Next 16's static export writes a `__next._full.txt` into every page
      # directory that is a BYTE-IDENTICAL twin of the sibling `index.txt`
      # (~22 900 files, ~1.5 GB per deploy). Nothing ever requests it — the
      # client router builds its RSC URL as `pathname += "index.txt"`, and
      # `_full` appears nowhere in the bundle, the HTML, the `__next._tree.txt`
      # payloads, the sitemap or the service worker. So we stop uploading it.
      #
      # That premise is a Next.js INTERNAL, and this repo takes Next minors via
      # the weekly dependabot `react-next` group. Two failure modes, two
      # responses — deliberately split:
      #
      #   * The files are GONE (Next renamed or dropped them). The ignore glob
      #     is now a no-op: we quietly stop saving, the site is fine. ADVISORY —
      #     ::warning:: and continue, same reasoning as the audit step above
      #     (BIN-344): this is the only prod path and a cost regression must not
      #     freeze an urgent hotfix.
      #   * The files EXIST but are no longer identical twins of index.txt. Now
      #     the glob may be dropping real content, and Firebase Hosting caches
      #     .txt for a day (see the headers block in firebase.json), so a bad
      #     deploy costs a rebuild plus a Cloudflare purge. BLOCKING.
      #
      # Guarding the invariant rather than the filename is the point: a name
      # check cannot catch "Next kept the name and changed the meaning".
      - name: Verify the ignored RSC twin is still a duplicate
        run: |
          set -euo pipefail
          FULL=$(find out -type f -name '__next._full.txt' | wc -l)
          INDEX=$(find out -type f -name 'index.txt' | wc -l)
          echo "__next._full.txt: $FULL   index.txt: $INDEX"

          if [ "$FULL" -eq 0 ]; then
            echo "::warning::No __next._full.txt in the build — the hosting.ignore entry is a no-op and the ~1.5 GB/deploy saving is gone. Next.js probably renamed the static-export segment artifacts. Re-check which files are unreferenced and update firebase.json + .claude/rules/deployment.md."
            exit 0
          fi

          if [ "$FULL" -ne "$INDEX" ]; then
            echo "::error::__next._full.txt ($FULL) and index.txt ($INDEX) no longer pair up 1:1 — the ignore glob may be dropping content that has no twin. Refusing to deploy."
            exit 1
          fi

          # Byte-identity on a sample. Full comparison would be 22 900 cmp calls.
          # 50 of ~22 900 only catches a SYSTEMIC change — which is the only
          # realistic one, since a Next upgrade changes every page the same way.
          # It would miss a single anomalous file; that is accepted.
          BAD=0
          for f in $(find out -type f -name '__next._full.txt' | shuf -n 50); do
            if ! cmp -s "$f" "$(dirname "$f")/index.txt"; then
              echo "::error::$f differs from its sibling index.txt"
              BAD=$((BAD + 1))
            fi
          done
          if [ "$BAD" -ne 0 ]; then
            echo "::error::$BAD of 50 sampled __next._full.txt files are NOT duplicates of index.txt. The premise behind the hosting.ignore entry no longer holds. Refusing to deploy."
            exit 1
          fi
          echo "50/50 sampled files are byte-identical twins — safe to ignore on upload."

      # Deploy hosting via a direct, pinned firebase-tools call instead of the
      # floating FirebaseExtended/action-hosting-deploy@v0. This is a faithful
      # inline replacement of what that action did (write the service-account
      # key to a temp file, point GOOGLE_APPLICATION_CREDENTIALS at it, run
      # `firebase deploy`) — but it lets us tolerate ONE specific error.
      #
      # BIN-331: when the built out/ is byte-identical to the currently-live
      # version (a scheduled metadata-refresh that changed no assets, or a
      # re-run), Firebase Hosting's release API returns HTTP 400 "is the current
      # active version". Content is already live and correct, so that error is a
      # no-op success — but the action treated it as a hard failure, turning
      # every no-op deploy RED and eroding trust in the deploy signal. Here we
      # treat that one message as success and still fail on anything else (bad
      # creds, quota, network).
      #
      # firebase-tools is pinned to 15.22.3 — the version the old action
      # resolved to and which we observed authenticating via the service-account
      # ADC path (GOOGLE_APPLICATION_CREDENTIALS). NOTE: this intentionally
      # DIFFERS from the rules-tests job's 14.27.0 pin — 14.x fails hosting auth
      # with "have you run firebase login?" because service-account ADC for
      # `deploy` only works reliably in the 15.x series; rules-tests keeps 14.27.0
      # for emulator-JAR compatibility. Two pins, two concerns.
      - name: Deploy to Firebase Hosting (tolerate idempotent-release 400)
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          SA="$RUNNER_TEMP/firebase-sa.json"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$SA"
          export GOOGLE_APPLICATION_CREDENTIALS="$SA"
          trap 'rm -f "$SA"' EXIT
          # GitHub's bash runs with `set -eo pipefail`, so disable it around the
          # capture or the step dies before we can read the exit code.
          set +e
          OUT=$(npx --yes firebase-tools@15.22.3 deploy --only hosting --project binge-nu --non-interactive 2>&1)
          CODE=$?
          set -e
          echo "$OUT"
          if [ "$CODE" -eq 0 ]; then
            echo "Hosting deploy succeeded."
            exit 0
          fi
          if printf '%s\n' "$OUT" | grep -qiF "is the current active version"; then
            echo "::notice::Hosting already serving this exact build — idempotent no-op release (HTTP 400, BIN-331). Treating as success."
            exit 0
          fi
          echo "::error::Firebase Hosting deploy failed for a non-idempotent reason — see log above."
          exit "$CODE"

  # Firestore security-rules tests run against the Firestore emulator (needs a
  # JVM). Mirrors ci.yml's rules-tests job so the suite executes on push-to-main
  # too — the deploy job above gates on it via `needs`. Kept separate so it can
  # fail independently and run in parallel with the build.
  rules-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install deps
        run: npm ci

      - name: Install Firebase CLI
        # firebase-tools provides the `firebase` binary that `npm run test:rules`
        # (firebase emulators:exec) needs. Pinned to match the version used locally.
        run: npm i -g firebase-tools@14.27.0

      - name: Cache Firestore emulator
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          # Version segment matches the firebase-tools pin above so a CLI bump
          # rotates the cache instead of reusing a stale emulator JAR.
          key: firebase-emulators-${{ runner.os }}-fbtools14.27.0

      - name: Rules tests (Firestore emulator)
        run: npm run test:rules
