name: Preview Deploy

on:
  pull_request:
    branches: [main]

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    # Kör inte preview för PRs från forks (de saknar åtkomst till secrets).
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install deps
        run: npm ci

      # Kvalitetsgrind FÖRE bygg/deploy (BIN-341): en PR som inte klarar
      # lint/typecheck/test ska inte få en live preview-URL. Bygget körs ändå
      # redan i ci.yml på samma PR, så vi duplicerar BARA de snabba grindarna
      # här (inte ett andra bygg) — ett rött test fäller jobbet innan Build, så
      # Deploy-steget aldrig nås. Tester varnar aldrig, de blockerar.
      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_TMDB_API_KEY: ${{ secrets.NEXT_PUBLIC_TMDB_API_KEY }}
          # Previewen har varken `.tmdb-cache`-restore eller step-timeout, till
          # skillnad från deploy.yml. Den måste alltså härleda urvalet från kall
          # cache varje gång, under 15-minuters räddningstaket, och en strypt
          # personhärledning skulle då fälla bygget på täckningsgolvet (BIN-823).
          # En preview är ingen produktionsdeploy — den får ha ett tunt urval.
          # Golvet ska bara skydda det som faktiskt ersätter binge.nu.
          SELECTION_ALLOW_THIN: '1'
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
          NEXT_PUBLIC_APP_ENV: preview
          NEXT_PUBLIC_GIT_SHA: ${{ github.event.pull_request.head.sha }}

      - name: Deploy preview channel
        # Pinned to the v0.11.0 commit SHA instead of the floating @v0 tag so a
        # maintainer push to v0 can't silently change what runs here (BIN-355).
        # This is the exact commit @v0 resolved to as of 2026-06-28, so it's a
        # behaviour-identical freeze. The preview path keeps using the action
        # (not a raw firebase deploy) for its PR-comment + channel-URL output.
        uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a # v0.11.0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: binge-nu
          # Channel lever 7 dagar — tillräckligt för en PR-granskning,
          # automatisk städning därefter.
          expires: 7d
