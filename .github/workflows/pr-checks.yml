name: PR checks

# The pre-merge check for pull requests, which in this repo means dependabot
# bumps — nobody else opens one (solo, push-direct-to-main per CLAUDE.md).
#
# WHY THIS EXISTS (BIN-1028, Malin's decision 2026-08-27). `ci.yml` and
# `preview.yml` were deleted because neither ever ran on main. That was right for
# main, but the two DID gate `pull_request`, so deleting them alone would have left
# a dependency bump reaching main with no lint, no typecheck and no test run on it —
# `secret-scan.yml` fires on a bare `push:` and would still have run gitleaks, which
# is not the same thing. This file is the deliberate replacement for that gap.
#
# WHAT IT DELIBERATELY DOES NOT DO:
#
#   · No `npm audit`. That is the step that made `ci.yml` red. Some of what it
#     reported is decided (BIN-603, production deps); the rest is dev-only and was
#     never examined. Derive the
#     split rather than trusting a number here — `npm audit --audit-level=high`
#     against `npm audit --omit=dev --audit-level=high`. `deploy.yml` still
#     surfaces audit findings as warnings on the path that ships.
#
#   · No `check-workflow-map.mjs` and no `check-public-env.mjs`. The deleted
#     `ci.yml` ran both on the PR path. `deploy.yml` runs them before Build, so
#     nothing reaching production is unchecked.
#
#   · No `rules-tests` job. The deleted `ci.yml` ran the Firestore emulator suite
#     on pull requests too. `deploy.yml` still gates on its own copy via `needs`,
#     so the production path is unchanged — but that suite does NOT run on a pull
#     request any more, and this list would read as exhaustive without saying so.
#
#   · No build, and therefore NO SECRETS. `preview.yml`s build referenced
#     `secrets.NEXT_PUBLIC_FIREBASE_*` and its deploy step published a live
#     channel; #4 Security Architect named that as a reason its removal was a net
#     gain rather than a loss. This job installs, lints, typechecks and tests —
#     none of which needs a key — so a PR can never reach one.
#
# The job is named `quality` on purpose: that is the status check the branch
# protection rule on main requires, and since `ci.yml` was its only producer the
# rule had become permanently unsatisfiable. This makes it satisfiable again for
# pull requests. It does NOT
# fix direct pushes to main, which do not run this workflow — removing that
# required check, or scoping it, is a GitHub-settings action only Malin can take.

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    # Nothing here calls the GitHub API — no PR comment, no check-run write (the
    # deleted preview.yml needed both). Pinned read-only anyway, so a step pasted
    # in later under this trigger inherits the narrow scope rather than the repo
    # default: #4 Security Architect's hardening note, 2026-08-27.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # functions/ is a SECOND npm project: its own package-lock.json, its own
      # tsconfig.json, its own pinned typescript. The root typecheck above cannot see
      # it — tsconfig.json excludes `functions` on purpose — and `npm test` runs its
      # vitest specs without typechecking them, because vitest transpiles. So nothing
      # in this repo typechecked functions/ at all, and a dependabot bump to
      # typescript 7 reached main with every check green; it surfaced only when a
      # human ran `firebase deploy --only functions` by hand (BIN-1051). This step is
      # BIN-1050: catch that here, before the merge.
      #
      # `npm ci`, never `npm install` — install can rewrite the lockfile in CI.
      # `--noEmit` because this is a check, not a build (`npm run build` is bare `tsc`
      # and would write functions/lib/). Run from inside functions/ so the tsc that
      # checks is the version functions/package.json pins, not the root one — a
      # mismatch there is the exact class of failure being guarded against.
      - name: Install functions deps
        working-directory: functions
        run: npm ci

      - name: Typecheck functions
        working-directory: functions
        run: npx tsc --noEmit

      # The same suite deploy.yml gates on. It carries the org checks that read
      # the working tree — the ownership map and the route selftests — so a
      # dependency bump that breaks one of those is caught here rather than on the
      # deploy. The history-reading checks are NOT covered: this is a shallow
      # checkout, and they bail to `unverified` rather than assert on one commit.
      - name: Test
        run: npm test
