# Håller beroenden uppdaterade utan att dränka inkorgen.
# Lite större grupperingar och månatlig kadens — detta är en solo-app,
# inte en enterprise-produkt.

version: 2
updates:
  # npm — alla TypeScript/React-beroenden
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Stockholm"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "npm"
    commit-message:
      prefix: "deps"
      include: "scope"
    groups:
      # React + Next — uppdateras tillsammans eftersom de är tätt kopplade
      react-next:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
          - "next"
          - "eslint-config-next"
      # Tailwind-stack
      tailwind:
        patterns:
          - "tailwindcss"
          - "postcss"
          - "autoprefixer"
          - "tailwind-merge"
          - "clsx"
      # Test-stack — vitest + testing-library ändras ofta tillsammans
      testing:
        patterns:
          - "vitest"
          - "@vitest/*"
          - "@vitejs/plugin-react"
          - "@testing-library/*"
          - "jsdom"
      # Firebase SDK — monorepo, vi vill inte mixa versioner
      firebase:
        patterns:
          - "firebase"
          - "firebase-admin"
          - "firebase-functions"
      # TanStack
      tanstack:
        patterns:
          - "@tanstack/*"
      # Alla övriga patch/minor → en samlad PR per vecka
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
        exclude-patterns:
          - "react"
          - "react-dom"
          - "next"
          - "firebase"
          - "tailwindcss"
          - "vitest"
          - "@tanstack/*"
    ignore:
      # Major-bumps kräver eftertanke — granska manuellt istället för PR-flod
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]

  # npm — Cloud Functions (egen package.json, scannas inte av root-blocket /).
  # Liten dep-tree → lågt PR-tak. firebase-admin + firebase-functions är
  # runtime-kopplade (en ensam funktions-bump som springer ifrån admin är just
  # den split-version-risk som landar på en yta utan preview-deploy) → grupperas.
  # Major-bumps kan ändra Node-runtime-kontraktet och bryta den manuella
  # functions-deployen → bara patch/minor automatiskt, majors granskas för hand.
  - package-ecosystem: "npm"
    directory: "/functions"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Stockholm"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "npm"
    commit-message:
      prefix: "deps(functions)"
      include: "scope"
    groups:
      firebase-functions:
        patterns:
          - "firebase-admin"
          - "firebase-functions"
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Major-bumps kräver eftertanke (Node-runtime + manuell deploy).
      - dependency-name: "firebase-admin"
        update-types: ["version-update:semver-major"]
      - dependency-name: "firebase-functions"
        update-types: ["version-update:semver-major"]

  # GitHub Actions — håll CI-workflows färska
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "06:00"
      timezone: "Europe/Stockholm"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "ci"
      include: "scope"
