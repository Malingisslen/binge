# Håller beroenden uppdaterade utan att dränka inkorgen.
# Lite större grupperingar och månatlig kadens — detta är en solo-app,
# inte en enterprise-produkt.

version: 2
updates:
  # npm — alla TypeScript/React-beroenden
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Stockholm"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "npm"
    commit-message:
      prefix: "deps"
      include: "scope"
    groups:
      # React + Next — uppdateras tillsammans eftersom de är tätt kopplade
      react-next:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
          - "next"
          - "eslint-config-next"
      # Tailwind-stack
      tailwind:
        patterns:
          - "tailwindcss"
          - "postcss"
          - "autoprefixer"
          - "tailwind-merge"
          - "clsx"
      # Test-stack — vitest + testing-library ändras ofta tillsammans
      testing:
        patterns:
          - "vitest"
          - "@vitest/*"
          - "@vitejs/plugin-react"
          - "@testing-library/*"
          - "jsdom"
      # Firebase SDK — monorepo, vi vill inte mixa versioner
      firebase:
        patterns:
          - "firebase"
          - "firebase-admin"
          - "firebase-functions"
      # TanStack
      tanstack:
        patterns:
          - "@tanstack/*"
      # Alla övriga patch/minor → en samlad PR per vecka
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
        exclude-patterns:
          - "react"
          - "react-dom"
          - "next"
          - "firebase"
          - "tailwindcss"
          - "vitest"
          - "@tanstack/*"
    ignore:
      # Major-bumps kräver eftertanke — granska manuellt istället för PR-flod
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
      # eslint, 2026-08-29: blockerad UPPSTRÖMS, inte av arbetsinsats. eslint 10 tog bort
      # det context-API `eslint-plugin-react` använder, och pluginen har inte följt efter —
      # dess senaste version deklarerar `eslint: ^3 || … || ^9.7` i sina peerDependencies.
      # Vi väljer den inte själva: `eslint-config-next` levererar den, och den ägs av next.
      # PR #53 föll på `TypeError: Error while loading rule 'react/display-name'`.
      # Utan den här posten öppnar roboten om samma omergebara PR varje vecka och en check
      # står permanent röd, vilket gör rött till normaltillstånd — då slutar man titta.
      # Sårbarheterna bakom höjningen är dev-only och når ingen besökare — härled dem:
      #   npm audit --omit=dev --audit-level=high    (0 fynd = inget når produktion)
      # BIN-658 bär avvägningen.
      # TA BORT HELA DEN HÄR POSTEN — kommentaren OCH båda raderna under. Att bara ta bort
      # `update-types` lämnar `- dependency-name: "eslint"` kvar, vilket för dependabot
      # betyder ignorera VARJE eslint-uppdatering: en tyst utvidgning, inte ett syntaxfel.
      # Blockeringen kan lösa sig på två sätt, så kolla båda:
      #   npm view eslint-plugin-react@latest peerDependencies
      #   npm view eslint-config-next@latest dependencies
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]

  # npm — Cloud Functions (egen package.json, scannas inte av root-blocket /).
  # Liten dep-tree → lågt PR-tak. firebase-admin + firebase-functions är
  # runtime-kopplade (en ensam funktions-bump som springer ifrån admin är just
  # den split-version-risk som landar på en yta utan preview-deploy) → grupperas.
  # Major-bumps kan ändra Node-runtime-kontraktet och bryta den manuella
  # functions-deployen → bara patch/minor automatiskt, majors granskas för hand.
  - package-ecosystem: "npm"
    directory: "/functions"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Stockholm"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "npm"
    commit-message:
      prefix: "deps(functions)"
      include: "scope"
    groups:
      firebase-functions:
        patterns:
          - "firebase-admin"
          - "firebase-functions"
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Major-bumps kräver eftertanke (Node-runtime + manuell deploy).
      - dependency-name: "firebase-admin"
        update-types: ["version-update:semver-major"]
      - dependency-name: "firebase-functions"
        update-types: ["version-update:semver-major"]
      # typescript, 2026-08-29: rot-blocket ovan har ignorerat dess majors sedan länge;
      # DET HÄR blocket gjorde det inte, så en robot-PR tog /functions från 5.9 till 7 och
      # bygget dog på moduleResolution "node", som 7 har tagit bort. Ingen grind TYPKOLLAR
      # functions/ — pr-checks.yml och deploy.yml kör bara rotens typecheck, och rotens
      # tsconfig.json exkluderar functions uttryckligen — så felet syns först när någon
      # försöker deploya funktionerna, vilket är den sämsta tänkbara stunden. Migreringen
      # till 7 är ett eget arbete, inte en bump: commonjs kan inte paras med
      # node16-resolution (TS5110), så module måste byta värde och det är en ändring med
      # egen räckvidd att mäta.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # GitHub Actions — håll CI-workflows färska
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "06:00"
      timezone: "Europe/Stockholm"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "ci"
      include: "scope"
