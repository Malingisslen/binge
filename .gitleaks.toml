# Gitleaks allowlist — binge. Only DOCUMENTED public-by-design values belong here.
# Baseline established 2026-07-16: 1 tracked-file finding, benign (below); real
# secrets live in gitignored .env* files.

[extend]
useDefault = true

[allowlist]
description = "Public-by-design client config"
paths = [
  # FCM service worker must embed the Firebase web client key — public by design.
  '''public/firebase-messaging-sw\.js''',
]
# Matched against the whole line, so only the Cloudflare Web Analytics beacon is let
# through: its token is sent to every visitor and only names the site (BIN-1457).
regexTarget = "line"
regexes = [
  '''data-cf-beacon='\{"token": "[0-9a-f]{32}"\}'''',
]
