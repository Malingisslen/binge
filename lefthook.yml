# Local commit gates. These exist so a type error or lint problem costs seconds at
# commit time instead of a push, a CI round-trip and a red main.
#
# Ported from Butlery's lefthook.yml (2026-08-08). Butlery learned the hard way
# that an ungated whole-project check runs on commits that contain no code at
# all: its analyze step cost 255s on a commit of one JSON and two markdown
# files. Every command here is glob-gated from the start.
#
# Manual run: npx lefthook run pre-commit
# Skip one hung step: LEFTHOOK_EXCLUDE=typecheck (never LEFTHOOK=0).

pre-commit:
  commands:
    # `tsc` must read the whole project — handing it file arguments makes it
    # ignore tsconfig.json, so this one cannot be scoped to staged files the way
    # lint is. The glob covers the inputs that can turn clean code red: the
    # sources, the compiler config, and the dependency set types resolve against.
    # Measured 22s warm / 48s cold on this repo (2026-08-08) — the slowest step
    # here by far, which is exactly why it must never run on a docs-only commit.
    typecheck:
      glob:
        - "*.ts"
        - "*.tsx"
        - "tsconfig.json"
        - "package.json"
        - "package-lock.json"
      run: npm run typecheck
      fail_text: "tsc found type errors. Fix them before committing (npm run typecheck)."
      priority: 1

    # eslint takes file arguments and still honours eslint.config.mjs, so unlike
    # typecheck this reads only what is staged.
    lint:
      glob:
        - "*.ts"
        - "*.tsx"
      run: npx eslint {staged_files}
      fail_text: "eslint found problems in the staged files. Fix them, or justify with a scoped inline disable."
      priority: 2

# BIN-917's criterion 4, and the reason it lives here rather than nowhere.
#
# The ticket asks that a batch not reach the COMMITTER without a stakeholder-review row in
# docs/org/metrics/events.jsonl. The first attempt at this ticket declared that impossible in
# this repo — "no .husky, no precommit in package.json" — and pulled the criterion out. Both
# probes were true and the conclusion was false: THIS FILE is the commit-time mechanism, it
# has been here since 2026-08-08, and the integration review found it in one grep. A search
# that looks for one tool's spelling and concludes the capability is absent is the same shape
# as the defect the ticket is about.
#
# `commit-msg` rather than `pre-commit` because the subject line is the evidence: the commit
# does not exist yet, so nothing can walk history for it, but the message being written names
# the tickets. `{1}` is the path to the message file.
#
commit-msg:
  commands:
    # NOT glob-gated, unlike the two pre-commit steps, and deliberately: this check reads the
    # SUBJECT, not the staged files, and a code-changing commit that touches no `.ts` is
    # exactly the case that escaped on 2026-08-16 (049f21b is a test-file commit). It costs
    # one node process and one file read — no toolchain, no compile. Measured well under a
    # second.
    review-coverage:
      run: node docs/org/metrics/check_review_coverage.mjs --message {1}
      fail_text: "This commit names a ticket with no stakeholder-review row (BIN-917). Log the review, or fix the subject."
      priority: 1

    # BIN-1059, and the sibling above owns the other half of the same question. That one asks
    # whether a review row EXISTS; this one asks whether it names the roles the STAGED files
    # actually route to. The selection routes the file set once and the set then moves — a
    # ticket is pulled, a critique widens the scope, a fix drags in a neighbour — and sprints
    # have committed under a panel that no longer matched. The named cases are in the module's
    # own header.
    #
    # `commit-msg` for the same reason as the sibling, and it is load-bearing rather than
    # tidy: the review rows are keyed by TICKET, and the ticket ids live in the subject line,
    # which does not exist yet while `pre-commit` runs. The staged files are readable in both
    # phases; the ids are not, so this cannot move up.
    staged-routing:
      run: node docs/org/metrics/check_staged_routing.mjs --message {1}
      fail_text: "The staged files route to a role no review row names (BIN-1059). Convene it, or commit split."
      priority: 2
