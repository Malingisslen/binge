<?xml version="1.0" encoding="UTF-8"?>
<!--
  OG image för Binge.nu — 1200x630 följer OG/Twitter card best-practice.
  Svensk orange-brun accent (#d97b35) på mörk bakgrund (#1e2028) matchar
  applayouten. SVG för skarp rendering; exportera till PNG 1200x630 innan
  vi lanserar om vi upptäcker att sociala plattformar inte renderar SVG
  pålitligt (Twitter brukar fungera, Slack kan vara bökigare).
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#1e2028"/>

  <!-- Accent-rand till vänster som matchar sidebar-touchen -->
  <rect x="0" y="0" width="12" height="630" fill="#d97b35"/>

  <!-- Wordmark -->
  <text x="80" y="280" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-size="120" font-weight="700" fill="#ffffff" letter-spacing="-2">
    Binge<tspan fill="#d97b35">.nu</tspan>
  </text>

  <!-- Tagline -->
  <text x="80" y="360" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-size="36" font-weight="400" fill="#cfcdc8">
    Håll koll på vad du tittar på
  </text>

  <!-- Sub-värde -->
  <text x="80" y="430" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-size="24" font-weight="400" fill="#8a8881">
    Film och serier på Netflix, Viaplay, HBO Max, Disney+, SVT Play och fler.
  </text>

  <!-- Färgprickar som antyder streamingtjänster (utan logotyper — vi har inte licens) -->
  <g transform="translate(80, 510)">
    <circle cx="12" cy="12" r="12" fill="#E50914"/>
    <circle cx="46" cy="12" r="12" fill="#F77F00"/>
    <circle cx="80" cy="12" r="12" fill="#113CCF"/>
    <circle cx="114" cy="12" r="12" fill="#8B1CD6"/>
    <circle cx="148" cy="12" r="12" fill="#E2001A"/>
    <circle cx="182" cy="12" r="12" fill="#159BFF"/>
  </g>
</svg>
